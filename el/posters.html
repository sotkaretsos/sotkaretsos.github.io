      <h1>Αφίσες</h1>
    </div>
  </header>
  <main class="wrap">
    <p class="lead" style="margin-top:24px">Αφίσες που παρουσίασαν οι φοιτητές μου και εγώ, οι νεότερες πρώτες. Πατήστε σε μια αφίσα για να ανοίξει σε πλήρες μέγεθος.</p>
    <figure class="poster" id="haicta2026">
      <a class="img" href="../assets/img/haicta2026-olive-oil-carbon-poster.jpg" aria-label="Άνοιγμα της αφίσας σε πλήρες μέγεθος">
        <img src="../assets/img/haicta2026-olive-oil-carbon-poster-900.jpg" srcset="../assets/img/haicta2026-olive-oil-carbon-poster-900.jpg 900w, ../assets/img/haicta2026-olive-oil-carbon-poster.jpg 2000w" sizes="(max-width: 1000px) 100vw, 940px" width="2000" height="1125" loading="lazy" alt="Poster with a three-block traceability architecture for olive oil and a bar chart of emission hotspots; 1.993 kg CO2eq per litre, 70.8% from fertilisation.">
      </a>
      <figcaption>
        <h2 lang="en">A Blockchain-Based Approach to Carbon Footprint Monitoring in Early-Stage Olive Oil Production</h2>
        <p class="en">HAICTA 2026 · Κως · 30 Σεπτεμβρίου – 3 Οκτωβρίου 2026</p>
        <p class="authors">Μ. Σταυροπούλου, Σ. Καρέτσος, Κ. Κωστοπούλου, Κ. Δεμέστιχας</p>
        <p class="note">Αρχιτεκτονική ιχνηλασιμότητας τριών blocks —καλλιέργεια και συγκομιδή, μεταφορά στο ελαιοτριβείο, επεξεργασία— με εγγραφές που προσυπογράφονται από ανεξάρτητους φορείς, σε ελαιώνα Κορωνέικης στη Δυτική Αχαΐα για τις περιόδους 2022–2024. Το αποτύπωμα άνθρακα του ελαιολάδου είναι 1,993 kg CO₂eq ανά λίτρο, το 81,5% του οποίου στον ελαιώνα. Στο πλαίσιο του έργου TALLHEDA, που χρηματοδοτείται από το πρόγραμμα Horizon Europe της ΕΕ (συμφωνία επιχορήγησης 101136578).</p>
        <div class="links"><a href="../assets/img/haicta2026-olive-oil-carbon-poster.jpg">Εικόνα σε πλήρες μέγεθος</a><a href="../assets/docs/haicta2026-olive-oil-carbon-poster.pdf">PDF</a></div>
      </figcaption>
    </figure>
    <figure class="poster" id="ai-beekeeping-education">
      <a class="img" href="../assets/img/ai-beekeeping-education-poster.jpg" aria-label="Άνοιγμα της αφίσας σε πλήρες μέγεθος">
        <img src="../assets/img/ai-beekeeping-education-poster-900.jpg" srcset="../assets/img/ai-beekeeping-education-poster-900.jpg 900w, ../assets/img/ai-beekeeping-education-poster.jpg 2000w" sizes="(max-width: 1000px) 100vw, 940px" width="2000" height="1125" loading="lazy" alt="Poster with bar charts comparing ChatGPT 3.5, Gemini, Copilot and Planty ChatGPT in Greek and English.">
      </a>
      <figcaption>
        <h2 lang="el">Συγκριτική Αξιολόγηση Εργαλείων Τεχνητής Νοημοσύνης για την Υποστήριξη της Μελισσοκομικής Εκπαίδευσης</h2>
        <p class="en">32ο Συνέδριο της Ελληνικής Εταιρείας της Επιστήμης των Οπωροκηπευτικών · Βόλος · 20–23 Οκτωβρίου 2025</p>
        <p class="authors">Ε. Κονταλή, Σ. Καρέτσος, Κ. Κωστοπούλου, Κ. Δεμέστιχας, Π. Χαριζάνης</p>
        <p class="note">Τα ChatGPT (GPT-3.5), Copilot, Gemini και Planty ChatGPT απάντησαν σε 20 ερωτήσεις μελισσοκομίας στα ελληνικά και στα αγγλικά, και τις απαντήσεις αξιολόγησε το Εργαστήριο Μελισσοκομίας-Σηροτροφίας. Το Planty ChatGPT πέτυχε 19/20 και στις δύο γλώσσες· στα ελληνικά ακολούθησαν το Copilot (16), το Gemini (10) και το ChatGPT-3.5 (7). Στο πλαίσιο του έργου TALLHEDA, που χρηματοδοτείται από το πρόγραμμα Horizon Europe της ΕΕ (συμφωνία επιχορήγησης 101136578).</p>
        <div class="links"><a href="../assets/img/ai-beekeeping-education-poster.jpg">Εικόνα σε πλήρες μέγεθος</a><a href="../assets/docs/ai-beekeeping-education-poster.pdf">PDF</a></div>
      </figcaption>
    </figure>
    <figure class="poster portrait" id="hsce2024">
      <a class="img" href="../assets/img/hsce2024-fisheries-blockchain-poster.jpg" aria-label="Άνοιγμα της αφίσας σε πλήρες μέγεθος">
        <img src="../assets/img/hsce2024-fisheries-blockchain-poster-800.jpg" srcset="../assets/img/hsce2024-fisheries-blockchain-poster-800.jpg 800w, ../assets/img/hsce2024-fisheries-blockchain-poster.jpg 1600w" sizes="(max-width: 1000px) 100vw, 940px" width="1600" height="2262" loading="lazy" alt="Portrait poster with pie and bar charts from a survey of 21 Greek fish farmers on blockchain traceability.">
      </a>
      <figcaption>
        <h2 lang="en">Blockchain-based Traceability Solutions in Fisheries: Insights from Greece</h2>
        <p class="en">Διεθνές Συνέδριο της Ελληνικής Εταιρείας Κυκλικής Οικονομίας · Χανιά · 12–13 Σεπτεμβρίου 2024</p>
        <p class="authors">Σ. Καρέτσος, Κ. Δεμέστιχας, Κ. Κωστοπούλου, Γ. Παντελής</p>
        <p class="note">Έρευνα σε 21 Έλληνες ιχθυοκαλλιεργητές, βασισμένη στο Technology Acceptance Model, για την πρόθεσή τους να υιοθετήσουν ιχνηλασιμότητα με blockchain. Οι παραγωγοί είναι θετικοί· τα κύρια εμπόδια είναι η πολυπλοκότητα της τεχνολογίας, το κόστος εγκατάστασης και συντήρησης και η έλλειψη ενημέρωσης και κατάρτισης από τις δημόσιες αρχές. Στο πλαίσιο του έργου TRUSTFOOD, που συγχρηματοδοτείται από το πρόγραμμα Digital Europe (συμφωνία επιχορήγησης 101100804).</p>
        <div class="links"><a href="../assets/img/hsce2024-fisheries-blockchain-poster.jpg">Εικόνα σε πλήρες μέγεθος</a><a href="../assets/docs/hsce2024-fisheries-blockchain-poster.pdf">PDF</a></div>
      </figcaption>
    </figure>
    <figure class="poster portrait" id="beekeeping-blockchain-2023">
      <a class="img" href="../assets/img/eeeo2023-beekeeping-blockchain-poster.jpg" aria-label="Άνοιγμα της αφίσας σε πλήρες μέγεθος">
        <img src="../assets/img/eeeo2023-beekeeping-blockchain-poster-800.jpg" srcset="../assets/img/eeeo2023-beekeeping-blockchain-poster-800.jpg 800w, ../assets/img/eeeo2023-beekeeping-blockchain-poster.jpg 1600w" sizes="(max-width: 1000px) 100vw, 940px" width="1600" height="2200" loading="lazy" alt="Portrait poster with a proposed blockchain traceability chain for honey, from beekeeper to packer, distributor, retailer and consumer, and the benefits of blockchain.">
      </a>
      <figcaption>
        <h2 lang="el">Ψηφιακός Μετασχηματισμός της Μελισσοκομίας: Η Περίπτωση της Τεχνολογίας Blockchain</h2>
        <p class="en">31ο Συνέδριο της Ελληνικής Εταιρείας της Επιστήμης των Οπωροκηπευτικών · 2023</p>
        <p class="authors">Σ. Καρέτσος, Κ. Δεμέστιχας, Χ. Χαριζάνης, Ε. Παπαδοπούλου, Κ. Κωστοπούλου</p>
        <p class="note">Σύστημα ιχνηλασιμότητας μελιού με blockchain που καταγράφει κάθε κρίκο της αλυσίδας, από τον μελισσοκόμο στον τυποποιητή, τον διανομέα, το σημείο πώλησης και τον καταναλωτή. Στόχος είναι ο περιορισμός της νοθείας και του παράνομα εισαγόμενου μελιού και η δυνατότητα των παραγωγών να μοιράζονται με τους καταναλωτές την επαληθευμένη ιστορία του μελιού τους. Η Ελλάδα έχει 2,1 εκατομμύρια κυψέλες και παράγει 15.000–20.000 τόνους τον χρόνο, το 7,4% της παραγωγής της ΕΕ· οι κύριοι περιορισμοί είναι το κόστος, ο διαμοιρασμός και η διαφάνεια των δεδομένων και η έλλειψη τεχνογνωσίας. Στο πλαίσιο του έργου TRUSTFOOD, που συγχρηματοδοτείται από το πρόγραμμα Digital Europe (συμφωνία επιχορήγησης 101100804).</p>
        <div class="links"><a href="../assets/img/eeeo2023-beekeeping-blockchain-poster.jpg">Εικόνα σε πλήρες μέγεθος</a><a href="../assets/docs/eeeo2023-beekeeping-blockchain-poster.pdf">PDF</a></div>
      </figcaption>
    </figure>
    <figure class="poster" id="llm-beekeeping">
      <a class="img" href="../assets/img/llm-beekeeping-poster.jpg" aria-label="Άνοιγμα της αφίσας σε πλήρες μέγεθος">
        <img src="../assets/img/llm-beekeeping-poster-900.jpg" srcset="../assets/img/llm-beekeeping-poster-900.jpg 900w, ../assets/img/llm-beekeeping-poster.jpg 2000w" sizes="(max-width: 1000px) 100vw, 940px" width="2000" height="1125" loading="lazy" alt="Poster with bar charts of correct answers per language model; LLaMA 3.2 3B Instruct leads with 85% and MiniOrca is last with 25%.">
      </a>
      <figcaption>
        <h2 lang="el">Συγκριτική Αξιολόγηση Απόδοσης Μεγάλων Γλωσσικών Μοντέλων: Η Περίπτωση της Μελισσοκομίας</h2>
        
        <p class="authors">Ε.-Ν. Καρέλα, Σ. Καρέτσος, Κ. Κωστοπούλου, Κ. Δεμέστιχας</p>
        <p class="note">Πέντε LLMs (LLaMA 3.2 3B Instruct, Qwen, Phi, DeepSeek, MiniOrca) απάντησαν σε 20 ερωτήσεις μελισσοκομίας με βάση 13 μελισσοκομικά βιβλία στο GPT4All. Το LLaMA 3.2 3B Instruct έδωσε 85% σωστές απαντήσεις. Σχετική εργασία: <a href="https://doi.org/10.21125/edulearn.2026.2194">EDULEARN26</a>. Στο πλαίσιο του έργου TALLHEDA, που χρηματοδοτείται από το πρόγραμμα Horizon Europe της ΕΕ (συμφωνία επιχορήγησης 101136578).</p>
        <div class="links"><a href="../assets/img/llm-beekeeping-poster.jpg">Εικόνα σε πλήρες μέγεθος</a><a href="../assets/docs/llm-beekeeping-poster.pdf">PDF</a></div>
      </figcaption>
    </figure>
    <figure class="poster" id="strawberry">
      <a class="img" href="../assets/img/strawberry-digital-farming-poster.jpg" aria-label="Άνοιγμα της αφίσας σε πλήρες μέγεθος">
        <img src="../assets/img/strawberry-digital-farming-poster-900.jpg" srcset="../assets/img/strawberry-digital-farming-poster-900.jpg 900w, ../assets/img/strawberry-digital-farming-poster.jpg 2000w" sizes="(max-width: 1000px) 100vw, 940px" width="2000" height="1125" loading="lazy" alt="Poster with a 16-stage strawberry crop cycle, the digital tools mapped to each stage and the StrawBot assistant.">
      </a>
      <figcaption>
        <h2 lang="el">Εργαλεία Ψηφιακής Γεωργίας στην Καλλιέργεια Φράουλας</h2>
        
        <p class="authors">Ζ. Παξινού, Κ. Κωστοπούλου, Σ. Καρέτσος, Κ. Δεμέστιχας</p>
        <p class="note">Καταγράφηκαν και αξιολογήθηκαν 50 ψηφιακά εργαλεία και αντιστοιχίστηκαν σε 16 στάδια του κύκλου καλλιέργειας της φράουλας σε τέσσερις εποχές, από την ανάλυση εδάφους έως τη μεταφορά. Ο ψηφιακός βοηθός StrawBot καθοδηγεί τον παραγωγό στην κατάλληλη εφαρμογή για κάθε στάδιο. Στο πλαίσιο του έργου TALLHEDA, που χρηματοδοτείται από το πρόγραμμα Horizon Europe της ΕΕ (συμφωνία επιχορήγησης 101136578).</p>
        <div class="links"><a href="../assets/img/strawberry-digital-farming-poster.jpg">Εικόνα σε πλήρες μέγεθος</a><a href="../assets/docs/strawberry-digital-farming-poster.pdf">PDF</a></div>
      </figcaption>
    </figure>
    <figure class="poster" id="wheatbot">
      <a class="img" href="../assets/img/wheatbot-poster.jpg" aria-label="Άνοιγμα της αφίσας σε πλήρες μέγεθος">
        <img src="../assets/img/wheatbot-poster-900.jpg" srcset="../assets/img/wheatbot-poster-900.jpg 900w, ../assets/img/wheatbot-poster.jpg 2000w" sizes="(max-width: 1000px) 100vw, 940px" width="2000" height="1125" loading="lazy" alt="Poster with screenshots of the WheatBot chatbot and bar charts of the growers&#x27; agreement with statements about it.">
      </a>
      <figcaption>
        <h2 lang="el">Ανάπτυξη και Αξιολόγηση Εφαρμογής Παραγωγικής Τεχνητής Νοημοσύνης για Υποστήριξη Λήψης Αποφάσεων από Παραγωγούς Σιταριού στην Ελλάδα</h2>
        
        <p class="authors">Μ. Μιμίκου, Κ. Κωστοπούλου, Σ. Καρέτσος, Κ. Δεμέστιχας</p>
        <p class="note">Το WheatBot, chatbot που αναπτύχθηκε με το Landbot πάνω σε 60 ερωταπαντήσεις για σπορά, άρδευση, λίπανση και φυτοπροστασία, αξιολογήθηκε από 55 παραγωγούς σιταριού με ερωτηματολόγιο βασισμένο στο Technology Acceptance Model. Η ευκολία χρήσης είχε τον υψηλότερο μέσο όρο (3,93/5), ακολουθούμενη από τη χρησιμότητα και την πρόθεση συνέχισης χρήσης (3,78–3,80). Στο πλαίσιο του έργου TALLHEDA, που χρηματοδοτείται από το πρόγραμμα Horizon Europe της ΕΕ (συμφωνία επιχορήγησης 101136578).</p>
        <div class="links"><a href="../assets/img/wheatbot-poster.jpg">Εικόνα σε πλήρες μέγεθος</a><a href="../assets/docs/wheatbot-poster.pdf">PDF</a></div>
      </figcaption>
    </figure>
