  <main class="wrap">
    <p class="lead" style="margin-top:24px">Posters presented by my students and me, newest first. Click a poster to open it at full size.</p>
    <figure class="poster" id="haicta2026">
      <a class="img" href="assets/img/haicta2026-olive-oil-carbon-poster.jpg" aria-label="Open the poster at full size">
        <img src="assets/img/haicta2026-olive-oil-carbon-poster-900.jpg" srcset="assets/img/haicta2026-olive-oil-carbon-poster-900.jpg 900w, assets/img/haicta2026-olive-oil-carbon-poster.jpg 2000w" sizes="(max-width: 1000px) 100vw, 940px" width="2000" height="1125" loading="lazy" alt="Poster with a three-block traceability architecture for olive oil and a bar chart of emission hotspots; 1.993 kg CO2eq per litre, 70.8% from fertilisation.">
      </a>
      <figcaption>
        <h2 lang="en">A Blockchain-Based Approach to Carbon Footprint Monitoring in Early-Stage Olive Oil Production</h2>
        <p class="en">HAICTA 2026 · Kos · 30 September – 3 October 2026</p>
        <p class="authors">M. Stavropoulou, S. Karetsos, C. Costopoulou, K. Demestichas</p>
        <p class="note">A three-block traceability architecture — cultivation and harvesting, transport to the mill, processing at the mill — with independently countersigned records, applied to a Koroneiki orchard in Western Achaia over the 2022–2024 seasons. The carbon footprint of the studied EVOO is 1.993 kg CO₂eq per litre, 81.5% of it at the orchard. Part of the TALLHEDA project, funded by the EU's Horizon Europe programme (grant agreement No. 101136578).</p>
        <div class="links"><a href="assets/img/haicta2026-olive-oil-carbon-poster.jpg">Full-size image</a><a href="assets/docs/haicta2026-olive-oil-carbon-poster.pdf">PDF</a></div>
      </figcaption>
    </figure>
    <figure class="poster" id="ai-beekeeping-education">
      <a class="img" href="assets/img/ai-beekeeping-education-poster.jpg" aria-label="Open the poster at full size">
        <img src="assets/img/ai-beekeeping-education-poster-900.jpg" srcset="assets/img/ai-beekeeping-education-poster-900.jpg 900w, assets/img/ai-beekeeping-education-poster.jpg 2000w" sizes="(max-width: 1000px) 100vw, 940px" width="2000" height="1125" loading="lazy" alt="Poster with bar charts comparing ChatGPT 3.5, Gemini, Copilot and Planty ChatGPT in Greek and English.">
      </a>
      <figcaption>
        <h2 lang="el">Συγκριτική Αξιολόγηση Εργαλείων Τεχνητής Νοημοσύνης για την Υποστήριξη της Μελισσοκομικής Εκπαίδευσης</h2>
        <p class="en">Comparative evaluation of artificial intelligence tools supporting beekeeping education</p><p class="en">32nd Congress of the Hellenic Society for Horticultural Science · Volos · 20–23 October 2025</p>
        <p class="authors">E. Kontali, S. Karetsos, C. Costopoulou, K. Demestichas, P. Harizanis</p>
        <p class="note">ChatGPT (GPT-3.5), Copilot, Gemini and Planty ChatGPT answered 20 beekeeping questions in Greek and in English, and researchers of the Laboratory of Sericulture and Apiculture judged the answers. Planty ChatGPT scored 19 out of 20 in both languages; in Greek, Copilot followed with 16, Gemini with 10 and ChatGPT-3.5 with 7. Part of the TALLHEDA project, funded by the EU's Horizon Europe programme (grant agreement No. 101136578).</p>
        <div class="links"><a href="assets/img/ai-beekeeping-education-poster.jpg">Full-size image</a><a href="assets/docs/ai-beekeeping-education-poster.pdf">PDF</a></div>
      </figcaption>
    </figure>
    <figure class="poster portrait" id="hsce2024">
      <a class="img" href="assets/img/hsce2024-fisheries-blockchain-poster.jpg" aria-label="Open the poster at full size">
        <img src="assets/img/hsce2024-fisheries-blockchain-poster-800.jpg" srcset="assets/img/hsce2024-fisheries-blockchain-poster-800.jpg 800w, assets/img/hsce2024-fisheries-blockchain-poster.jpg 1600w" sizes="(max-width: 1000px) 100vw, 940px" width="1600" height="2262" loading="lazy" alt="Portrait poster with pie and bar charts from a survey of 21 Greek fish farmers on blockchain traceability.">
      </a>
      <figcaption>
        <h2 lang="en">Blockchain-based Traceability Solutions in Fisheries: Insights from Greece</h2>
        <p class="en">International Conference of the Hellenic Society for Circular Economy · Chania · 12–13 September 2024</p>
        <p class="authors">S. Karetsos, K. Demestichas, C. Costopoulou, G. Pantelis</p>
        <p class="note">A survey of 21 Greek fish farmers, based on the Technology Acceptance Model, on their intention to adopt blockchain-based traceability. The farmers are open to it; the main barriers are the complexity of the technology, set-up and maintenance costs, and the lack of information and training from public authorities. Developed in the TRUSTFOOD project, co-funded by the Digital Europe programme (grant agreement No. 101100804).</p>
        <div class="links"><a href="assets/img/hsce2024-fisheries-blockchain-poster.jpg">Full-size image</a><a href="assets/docs/hsce2024-fisheries-blockchain-poster.pdf">PDF</a></div>
      </figcaption>
    </figure>
    <figure class="poster" id="llm-beekeeping">
      <a class="img" href="assets/img/llm-beekeeping-poster.jpg" aria-label="Open the poster at full size">
        <img src="assets/img/llm-beekeeping-poster-900.jpg" srcset="assets/img/llm-beekeeping-poster-900.jpg 900w, assets/img/llm-beekeeping-poster.jpg 2000w" sizes="(max-width: 1000px) 100vw, 940px" width="2000" height="1125" loading="lazy" alt="Poster with bar charts of correct answers per language model; LLaMA 3.2 3B Instruct leads with 85% and MiniOrca is last with 25%.">
      </a>
      <figcaption>
        <h2 lang="el">Συγκριτική Αξιολόγηση Απόδοσης Μεγάλων Γλωσσικών Μοντέλων: Η Περίπτωση της Μελισσοκομίας</h2>
        <p class="en">Comparative performance evaluation of large language models: the case of beekeeping</p>
        <p class="authors">E.-N. Karela, S. Karetsos, C. Costopoulou, K. Demestichas</p>
        <p class="note">Five LLMs (LLaMA 3.2 3B Instruct, Qwen, Phi, DeepSeek, MiniOrca) answered 20 beekeeping questions using a corpus of 13 beekeeping books in GPT4All. LLaMA 3.2 3B Instruct gave 85% correct answers. Related paper: <a href="https://doi.org/10.21125/edulearn.2026.2194">EDULEARN26</a>. Part of the TALLHEDA project, funded by the EU's Horizon Europe programme (grant agreement No. 101136578).</p>
        <div class="links"><a href="assets/img/llm-beekeeping-poster.jpg">Full-size image</a><a href="assets/docs/llm-beekeeping-poster.pdf">PDF</a></div>
      </figcaption>
    </figure>
    <figure class="poster" id="strawberry">
      <a class="img" href="assets/img/strawberry-digital-farming-poster.jpg" aria-label="Open the poster at full size">
        <img src="assets/img/strawberry-digital-farming-poster-900.jpg" srcset="assets/img/strawberry-digital-farming-poster-900.jpg 900w, assets/img/strawberry-digital-farming-poster.jpg 2000w" sizes="(max-width: 1000px) 100vw, 940px" width="2000" height="1125" loading="lazy" alt="Poster with a 16-stage strawberry crop cycle, the digital tools mapped to each stage and the StrawBot assistant.">
      </a>
      <figcaption>
        <h2 lang="el">Εργαλεία Ψηφιακής Γεωργίας στην Καλλιέργεια Φράουλας</h2>
        <p class="en">Digital farming tools in strawberry cultivation</p>
        <p class="authors">Z. Paxinou, C. Costopoulou, S. Karetsos, K. Demestichas</p>
        <p class="note">Fifty digital farming tools were recorded, evaluated and mapped to a 16-stage strawberry crop cycle over four seasons, from soil analysis to transport. The StrawBot digital assistant guides growers to the right application for each stage. Part of the TALLHEDA project, funded by the EU's Horizon Europe programme (grant agreement No. 101136578).</p>
        <div class="links"><a href="assets/img/strawberry-digital-farming-poster.jpg">Full-size image</a><a href="assets/docs/strawberry-digital-farming-poster.pdf">PDF</a></div>
      </figcaption>
    </figure>
    <figure class="poster" id="wheatbot">
      <a class="img" href="assets/img/wheatbot-poster.jpg" aria-label="Open the poster at full size">
        <img src="assets/img/wheatbot-poster-900.jpg" srcset="assets/img/wheatbot-poster-900.jpg 900w, assets/img/wheatbot-poster.jpg 2000w" sizes="(max-width: 1000px) 100vw, 940px" width="2000" height="1125" loading="lazy" alt="Poster with screenshots of the WheatBot chatbot and bar charts of the growers&#x27; agreement with statements about it.">
      </a>
      <figcaption>
        <h2 lang="el">Ανάπτυξη και Αξιολόγηση Εφαρμογής Παραγωγικής Τεχνητής Νοημοσύνης για Υποστήριξη Λήψης Αποφάσεων από Παραγωγούς Σιταριού στην Ελλάδα</h2>
        <p class="en">Development and evaluation of a generative AI application supporting decision-making by wheat growers in Greece</p>
        <p class="authors">M. Mimikou, C. Costopoulou, S. Karetsos, K. Demestichas</p>
        <p class="note">WheatBot, a chatbot built with Landbot on 60 questions and answers about sowing, irrigation, fertilisation and plant protection, was evaluated by 55 wheat growers with a questionnaire based on the Technology Acceptance Model. Ease of use scored highest (3.93 out of 5), followed by usefulness and intention to keep using it (3.78–3.80). Part of the TALLHEDA project, funded by the EU's Horizon Europe programme (grant agreement No. 101136578).</p>
        <div class="links"><a href="assets/img/wheatbot-poster.jpg">Full-size image</a><a href="assets/docs/wheatbot-poster.pdf">PDF</a></div>
      </figcaption>
    </figure>
